<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-mix Online Store | Premium Tech & Software</title>
    
    <!-- ======================================================================= -->
    <!-- 🔴🔴🔴 දත්ත වෙනස් කරන ස්ථානය 🔴🔴🔴 -->
    <!-- ======================================================================= -->
    <script>
        // 📞 1. ඔබේ දුරකථන අංක සහ සමාජ මාධ්‍ය ලින්ක්
        const contactInfo = {
            phone: "0715205901",
            whatsapp: "94782482855",
            facebook: "https://web.facebook.com/people/E-Mix/61553416852131/?rdid=EqNHQuLBRIuuqYXV"
        };

        // 📊 2. ඔබගේ Google Sheet CSV Link එක මෙතැනට Paste කරන්න 👇
        const googleSheetCSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSCChyKpmHDsyJ1ySiSktqo0KGrSTZygfRjC8SjdyJQivg1St6dt6_hPb0Bj4INQTktwbL5dtFlleMz/pub?gid=0&single=true&output=csv"; 
    </script>
    <!-- ======================================================================= -->

    <!-- Fonts & CSV Parser -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    
    <style>
        :root {
            --primary: #d4af37; /* Gold Color */
            --primary-glow: rgba(212, 175, 55, 0.4);
            --bg-dark: #0a0f16;
            --card-bg: rgba(20, 25, 32, 0.8);
            --text-light: #f1f5f9;
            --text-muted: #94a3b8;
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-light); 
            margin: 0; padding: 0;
            overflow-x: hidden;
        }
        
        /* Navigation */
        nav {
            position: fixed; top: 0; width: 100%;
            background: rgba(10, 15, 22, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 1000; display: flex; justify-content: center;
            padding: 15px 0; gap: 10px;
        }

        .lang-btn { 
            background: transparent; border: 1px solid var(--primary); 
            color: var(--text-light); padding: 6px 20px; 
            border-radius: 30px; cursor: pointer; font-weight: 600; 
            transition: all 0.3s ease; 
        }
        .lang-btn:hover, .lang-btn.active { background: var(--primary); color: #000; }

        /* Header */
        header { text-align: center; padding: 100px 20px 40px 20px; }
        .logo { width: 140px; border-radius: 20px; box-shadow: 0 10px 30px var(--primary-glow); margin-bottom: 15px; }
        h1 { font-size: 3em; margin: 0 0 5px 0; font-weight: 800; color: #fff;}
        p.tagline { color: var(--text-muted); font-size: 1.1em; letter-spacing: 1px; }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        h2.section-title { text-align: center; color: #fff; font-size: 2em; margin: 20px 0 40px 0; }
        h2.section-title span { color: var(--primary); }

        /* Home View - Categories */
        .category-container { display: flex; justify-content: center; gap: 30px; padding: 20px; flex-wrap: wrap; }
        .category-card {
            background: var(--card-bg); padding: 40px; border-radius: 20px; text-align: center; cursor: pointer;
            width: 250px; border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: all 0.4s ease;
            border-bottom: 4px solid var(--primary);
        }
        .category-card:hover { transform: translateY(-10px); box-shadow: 0 15px 40px var(--primary-glow); border-color: var(--primary); }
        .category-card h2 { margin: 15px 0 0 0; font-size: 28px; color: var(--primary); }
        .category-card .icon { font-size: 50px; }

        /* Data View - Grid (Daraz/AliExpress Style) */
        #data-view { display: none; }
        .back-btn { 
            background: transparent; color: var(--primary); border: 1px solid var(--primary);
            padding: 8px 20px; border-radius: 30px; cursor: pointer; margin-bottom: 20px; font-size: 16px; transition: 0.3s;
            display: inline-flex; align-items: center; gap: 8px;
        }
        .back-btn:hover { background: var(--primary); color: #000; }
        
        .items-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; 
        }
        
        .item-card { 
            background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.05); 
            border-radius: 15px; overflow: hidden; position: relative;
            transition: all 0.4s ease; display: flex; flex-direction: column;
        }
        .item-card:hover { transform: translateY(-8px); border-color: var(--primary); box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        
        .item-img-container { width: 100%; height: 220px; background-color: #05080c; }
        .item-img-container img { width: 100%; height: 100%; object-fit: cover; }
        
        .item-details { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
        .item-title { color: #fff; font-size: 1.2em; margin: 0 0 10px 0; line-height: 1.3; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .item-price { color: var(--primary); font-weight: 800; font-size: 1.4em; margin-bottom: 10px; }
        .item-desc { font-size: 0.9em; color: var(--text-muted); line-height: 1.5; margin-bottom: 20px; flex-grow: 1; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        
        .buy-btn { 
            text-align: center; background: var(--primary); color: #000; padding: 10px; 
            text-decoration: none; border-radius: 8px; font-weight: 600; transition: 0.3s; width: 100%; box-sizing: border-box; display: block;
        }
        .buy-btn:hover { background: #fff; box-shadow: 0 0 15px var(--primary-glow); }

        /* Contact Section */
        .contact-section { 
            background: linear-gradient(145deg, rgba(20, 25, 32, 0.8), rgba(10, 15, 22, 0.9));
            padding: 50px 30px; margin-top: 60px; border-radius: 24px; text-align: center; 
            border: 1px solid rgba(255, 255, 255, 0.05); 
        }
        
        .btn-group { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-top:25px;}
        .btn { padding: 12px 25px; color: white; text-decoration: none; border-radius: 50px; font-weight: 600; font-size: 0.95em; transition: 0.3s;}
        .btn:hover { transform: scale(1.05); }
        .btn-call { background: var(--primary); color: #000; }
        .btn-wa { background: #25D366; }
        .btn-fb { background: #1877F2; }
        
        footer { text-align: center; padding: 30px; color: var(--text-muted); font-size: 0.9em; }
        .loading-text { text-align: center; color: var(--primary); font-size: 1.2em; padding: 50px; }
    </style>
</head>
<body>

    <!-- Language Navigation -->
    <nav>
        <button class="lang-btn active" onclick="setLanguage('si')">සිංහල</button>
        <button class="lang-btn" onclick="setLanguage('en')">English</button>
        <button class="lang-btn" onclick="setLanguage('ta')">தமிழ்</button>
    </nav>

    <!-- Header / Logo -->
    <header>
        <img src="pic001.png" alt="E-Mix Logo" class="logo" onerror="this.style.display='none'">
        <h1>E-Mix Store</h1>
        <p class="tagline" id="txt-tagline">"New Technology Near You, Experience It.."</p>
    </header>

    <div class="container">
        <div id="loading" class="loading-text">දත්ත පූරණය වෙමින් පවතී... (Loading Data...)</div>

        <!-- Home View (Categories) -->
        <div id="home-view" style="display: none;">
            <h2 class="section-title" id="txt-select-cat">ඔබට අවශ්‍ය අංශය <span>තෝරන්න</span></h2>
            
            <div class="category-container">
                <div class="category-card" onclick="showCategory('Product')">
                    <div class="icon">🛍️</div>
                    <h2 id="txt-cat-products">භාණ්ඩ</h2>
                </div>
                <div class="category-card" onclick="showCategory('Service')">
                    <div class="icon">🛠️</div>
                    <h2 id="txt-cat-services">සේවා</h2>
                </div>
            </div>
        </div>

        <!-- Data View (Grid) -->
        <div id="data-view">
            <button class="back-btn" onclick="goBack()" id="btn-back">⬅ ආපසු (Back)</button>
            <h2 class="section-title" id="view-title">අපගේ <span>භාණ්ඩ</span></h2>
            
            <div class="items-grid" id="items-container"></div>
        </div>

        <!-- Contact Section -->
        <div class="contact-section">
            <h2 class="section-title" id="txt-contact-title">අපව <span>සම්බන්ධ කරගන්න</span></h2>
            <p id="txt-address">📍 අනුරාධපුරය, ශ්‍රී ලංකාව</p>
            
            <div class="btn-group">
                <a href="#" class="btn btn-call" id="btn-call">📞 Call Us</a>
                <a href="#" class="btn btn-wa" id="txt-wa">💬 WhatsApp</a>
                <a href="#" class="btn btn-fb" target="_blank" id="txt-fb">📘 Facebook</a>
            </div>
        </div>
    </div>

    <footer>&copy; 2026 E-Mix Online Store. All Rights Reserved.</footer>

    <script>
        let currentLang = 'si';
        let allItems = []; 

        // භාෂා පරිවර්තන (Website UI සඳහා පමණක්)
        const translations = {
            si: { tagline: "ඔබ අසල ඇති නවීන තාක්ෂණය, එය අත්විඳින්න..", selectCat: "ඔබට අවශ්‍ය අංශය <span>තෝරන්න</span>", catProd: "භාණ්ඩ", catServ: "සේවා", backBtn: "⬅ ආපසු", contactTitle: "අපව <span>සම්බන්ධ කරගන්න</span>", address: "📍 අනුරාධපුරය, ශ්‍රී ලංකාව", waBtn: "💬 WhatsApp", fbBtn: "📘 Facebook" },
            en: { tagline: "New Technology Near You, Experience It..", selectCat: "Select Your <span>Category</span>", catProd: "Products", catServ: "Services", backBtn: "⬅ Back", contactTitle: "<span>Contact</span> Us", address: "📍 Anuradhapura, Sri Lanka", waBtn: "💬 WhatsApp", fbBtn: "📘 Facebook" },
            ta: { tagline: "உங்களுக்கு அருகிலுள்ள புதிய தொழில்நுட்பம்..", selectCat: "உங்கள் வகையைத் <span>தேர்ந்தெடுக்கவும்</span>", catProd: "தயாரிப்புகள்", catServ: "சேவைகள்", backBtn: "⬅ பின்னால்", contactTitle: "எங்களை <span>தொடர்பு கொள்ள</span>", address: "📍 அனுராதபுரம், இலங்கை", waBtn: "💬 WhatsApp", fbBtn: "📘 Facebook" }
        };

        function setLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.getAttribute('onclick').includes(`'${lang}'`)) btn.classList.add('active');
            });

            document.getElementById('txt-tagline').innerText = translations[lang].tagline;
            document.getElementById('txt-select-cat').innerHTML = translations[lang].selectCat;
            document.getElementById('txt-cat-products').innerText = translations[lang].catProd;
            document.getElementById('txt-cat-services').innerText = translations[lang].catServ;
            document.getElementById('btn-back').innerText = translations[lang].backBtn;
            document.getElementById('txt-contact-title').innerHTML = translations[lang].contactTitle;
            document.getElementById('txt-address').innerText = translations[lang].address;
            document.getElementById('txt-wa').innerText = translations[lang].waBtn;
            document.getElementById('txt-fb').innerText = translations[lang].fbBtn;
            
            // දැනට Data view එකේ ඉන්නවා නම් Title එක මාරු කරන්න
            let viewTitle = document.getElementById('view-title').innerHTML;
            if(viewTitle.includes('භාණ්ඩ') || viewTitle.includes('Products') || viewTitle.includes('தயாரிப்புகள்')) {
                document.getElementById('view-title').innerHTML = lang === 'si' ? "අපගේ <span>භාණ්ඩ</span>" : (lang === 'en' ? "Our <span>Products</span>" : "எங்கள் <span>தயாரிப்புகள்</span>");
            } else {
                document.getElementById('view-title').innerHTML = lang === 'si' ? "අපගේ <span>සේවා</span>" : (lang === 'en' ? "Our <span>Services</span>" : "எங்கள் <span>சேவைகள்</span>");
            }
        }

        function setContactDetails() {
            document.getElementById('btn-call').href = `tel:${contactInfo.phone}`;
            document.getElementById('btn-call').innerHTML = `📞 ${contactInfo.phone}`;
            
            // WhatsApp Link එකට සාමාන්‍ය පණිවිඩයක් එකතු කිරීම
            let waMsg = encodeURIComponent("Hello E-Mix, I would like to know more details.");
            document.getElementById('txt-wa').href = `https://wa.me/${contactInfo.whatsapp}?text=${waMsg}`;
            
            document.getElementById('txt-fb').href = contactInfo.facebook;
        }

        // Google Drive පින්තූර වෙබ් අඩවියට සහාය දක්වන ලෙස සකස් කිරීම
        function fixGoogleDriveImage(url) {
            if (url && url.includes('drive.google.com')) {
                let id = url.match(/[-\w]{25,}/); 
                if (id) { return `https://drive.google.com/uc?export=view&id=${id[0]}`; }
            }
            return url;
        }

        function fetchGoogleSheetData() {
            Papa.parse(googleSheetCSV, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    allItems = results.data;
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('home-view').style.display = 'block'; // දත්ත ආ පසු මුල් පිටුව පෙන්වයි
                },
                error: function(err) {
                    document.getElementById('loading').innerHTML = "⚠️ දත්ත ලබා ගැනීමේදී දෝෂයක් ඇති විය. කරුණාකර අන්තර්ජාල සම්බන්ධතාවය පරීක්ෂා කරන්න.";
                }
            });
        }

        function showCategory(categoryType) {
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('data-view').style.display = 'block';
            window.scrollTo({ top: 150, behavior: 'smooth' }); // Scroll to top smoothly
            
            // මාතෘකාව සැකසීම
            if(categoryType === 'Product') {
                document.getElementById('view-title').innerHTML = currentLang === 'si' ? "අපගේ <span>භාණ්ඩ</span>" : (currentLang === 'en' ? "Our <span>Products</span>" : "எங்கள் <span>தயாரிப்புகள்</span>");
            } else {
                document.getElementById('view-title').innerHTML = currentLang === 'si' ? "අපගේ <span>සේවා</span>" : (currentLang === 'en' ? "Our <span>Services</span>" : "எங்கள் <span>சேவைகள்</span>");
            }

            const container = document.getElementById('items-container');
            container.innerHTML = '';

            // තෝරාගත් අංශයට අදාළ දත්ත පෙරීම (Filter by Type - Product/Service)
            const filteredData = allItems.filter(item => {
                let type = (item.Type || "").trim().toLowerCase();
                if(categoryType === 'Product') {
                    return type === 'product' || type === 'භාණ්ඩ';
                } else {
                    return type === 'service' || type === 'සේවා';
                }
            });

            if(filteredData.length === 0) {
                container.innerHTML = `<p style="text-align:center; width:100%; color:var(--text-muted);">මෙම අංශයේ දත්ත තවම ඇතුළත් කර නොමැත.</p>`;
                return;
            }

            // Cards නිර්මාණය කිරීම
            filteredData.forEach(item => {
                // Sheet එකේ Header නම් වෙනස් වුවහොත් දත්ත ලබාගන්නා ආකාරය
                const name = item.Name || item.name || '';
                const price = item.Price || item.price || 'මිල සඳහන් කර නැත';
                const desc = item.Description || item.description || '';
                const imageUrl = fixGoogleDriveImage(item.Image || item.image);
                
                const imageHTML = imageUrl ? `<img src="${imageUrl}" alt="${name}">` : `<div style="display:flex; height:100%; align-items:center; justify-content:center; color:#555;">No Image</div>`;
                
                // WhatsApp හරහා භාණ්ඩය ගැන විමසීමට Link එක සකස් කිරීම
                let itemWaMsg = encodeURIComponent(`Hello E-Mix, I would like to know more about this item: ${name} (Price: ${price})`);
                let buyLink = `https://wa.me/${contactInfo.whatsapp}?text=${itemWaMsg}`;

                const cardHTML = `
                    <div class="item-card">
                        <div class="item-img-container">${imageHTML}</div>
                        <div class="item-details">
                            <h3 class="item-title">${name}</h3>
                            <div class="item-price">Rs. ${price}</div>
                            <p class="item-desc">${desc}</p>
                            <a href="${buyLink}" target="_blank" class="buy-btn">🛒 Buy Now / විමසන්න</a>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        function goBack() {
            document.getElementById('home-view').style.display = 'block';
            document.getElementById('data-view').style.display = 'none';
        }

        window.onload = () => {
            setContactDetails();
            setLanguage('si'); 
            fetchGoogleSheetData(); 
        };
    </script>
</body>
</html>
