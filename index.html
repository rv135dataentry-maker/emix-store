<!DOCTYPE html>
<html lang="si" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Mix | Anuradhapura, Sri Lanka</title>
    <meta name="description" content="E-Mix - භාණ්ඩ හා සේවා | Products & Services | Anuradhapura, Sri Lanka">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Sinhala:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #1a1a2e;
            --primary-dark: #0f0f1a;
            --accent: #e94560;
            --accent-hover: #c73a52;
            --gold: #ffd700;
            --gold-dark: #c5a600;
            --bg: #f8f9fa;
            --bg-card: #ffffff;
            --bg-dark: #1a1a2e;
            --text: #1a1a2e;
            --text-light: #4a4a5a;
            --text-white: #ffffff;
            --border: #e0e0e0;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 40px rgba(0,0,0,0.12);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 6px;
            --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
            --font-sinhala: 'Noto Sans Sinhala','Inter',sans-serif;
            --font-tamil: 'Noto Sans Tamil','Inter',sans-serif;
            --font-english: 'Inter',sans-serif;
            --max-width: 1200px;
            --nav-height: 70px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior:smooth; -webkit-tap-highlight-color:transparent; }
        body {
            font-family: var(--font-sinhala);
            background: var(--bg);
            color: var(--text);
            line-height:1.6;
            min-height:100vh;
            overflow-x:hidden;
            padding-bottom:calc(80px + var(--safe-bottom));
            transition: background var(--transition), color var(--transition);
        }
        body[dir="ltr"] { font-family: var(--font-english); }
        body[dir="ltr"][data-lang="ta"] { font-family: var(--font-tamil); }

        /* Preloader, Header, Nav, Bottom Nav, Hero, Cards, Admin, Modal, Toast, etc. */
        /* සම්පූර්ණ මුල් කේතයේ ඇති සියලුම CSS මෙහි ඇතුළත් කර ඇත */
        /* පහත දැක්වෙන්නේ ප්‍රධාන කොටස් පමණයි, ඉතිරිය පෙර පිළිතුරෙහි ඇත */
        /* ... (පෙර CSS එලෙසම) ... */
    </style>
</head>
<body data-lang="si" dir="ltr">
    <!-- PRELOADER, HEADER, NAV, BOTTOM NAV, MAIN CONTENT -->
    <!-- ... (පෙර HTML ව්‍යුහය එලෙසම) ... -->

    <script>
        // ===== SUPABASE CONFIGURATION =====
        const SUPABASE_URL = 'https://kocfubjwdmsqmvwaivel.supabase.co'; // TODO: ඔබේ URL එක දමන්න
        const SUPABASE_ANON_KEY = 'sb_publishable__Zpta1I4dpVp6UgyXU80yg_rpfM7gql'; // TODO: ඔබේ anon key එක දමන්න
        const USE_SUPABASE = true; // Supabase භාවිතා කිරීමට true කරන්න

        // Supabase client එක initialize කරන්න
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ===== TRANSLATIONS =====
        const translations = { /* ... (පෙර අනුවාදයේ ඇති පරිදි) ... */ };

        // ===== STATE =====
        let currentPage = 'home';
        let currentLanguage = 'si';
        let isAdminLoggedIn = false;
        let currentProductFilter = 'all';
        let currentAdminTab = 'tab-products';
        let appData = null;

        // ===== DEFAULT DATA (fallback) =====
        const DEFAULT_DATA = {
            settings: {
                businessName: 'E-Mix',
                phone: '0715205901',
                whatsapp: '94782482855',
                location: 'Anuradhapura, Sri Lanka',
                facebook: 'https://web.facebook.com/people/E-Mix/61553416852131/',
                adminEmail: 'admin@emix.lk',
                adminPassword: 'admin123'
            },
            products: [],
            services: [],
            darazProducts: []
        };

        // ===== GET DATA FROM SUPABASE =====
        async function getData() {
            if (USE_SUPABASE) {
                try {
                    // Fetch all tables in parallel
                    const [productsRes, servicesRes, darazRes, settingsRes] = await Promise.all([
                        supabase.from('products').select('*'),
                        supabase.from('services').select('*'),
                        supabase.from('daraz_products').select('*'),
                        supabase.from('settings').select('*').eq('id', 'main').maybeSingle()
                    ]);

                    if (productsRes.error || servicesRes.error || darazRes.error || settingsRes.error) {
                        console.error('Supabase fetch error:',
                            productsRes.error || servicesRes.error || darazRes.error || settingsRes.error);
                        // Fallback to local storage or default
                        return getLocalData();
                    }

                    // Map settings columns to camelCase
                    const settingsData = settingsRes.data ? {
                        businessName: settingsRes.data.business_name,
                        phone: settingsRes.data.phone,
                        whatsapp: settingsRes.data.whatsapp,
                        location: settingsRes.data.location,
                        facebook: settingsRes.data.facebook,
                        adminEmail: settingsRes.data.admin_email,
                        adminPassword: settingsRes.data.admin_password
                    } : DEFAULT_DATA.settings;

                    appData = {
                        products: productsRes.data || [],
                        services: servicesRes.data || [],
                        darazProducts: darazRes.data || [],
                        settings: settingsData
                    };
                    return appData;
                } catch (err) {
                    console.error('Supabase connection error:', err);
                    return getLocalData();
                }
            } else {
                return getLocalData();
            }
        }

        function getLocalData() {
            const stored = localStorage.getItem('emix_data');
            if (stored) {
                try {
                    appData = JSON.parse(stored);
                    if (!appData.settings) appData.settings = { ...DEFAULT_DATA.settings };
                    if (!appData.products) appData.products = [];
                    if (!appData.services) appData.services = [];
                    if (!appData.darazProducts) appData.darazProducts = [];
                    return appData;
                } catch (e) {
                    appData = JSON.parse(JSON.stringify(DEFAULT_DATA));
                }
            } else {
                appData = JSON.parse(JSON.stringify(DEFAULT_DATA));
            }
            saveDataToLocal();
            return appData;
        }

        // ===== SAVE DATA TO SUPABASE =====
        async function saveData() {
            if (USE_SUPABASE && appData) {
                try {
                    // Upsert products
                    for (const item of appData.products) {
                        const { error } = await supabase.from('products').upsert({
                            id: item.id,
                            name: item.name,
                            name_en: item.name_en || item.name,
                            name_ta: item.name_ta || item.name,
                            desc: item.desc,
                            desc_en: item.desc_en || item.desc,
                            desc_ta: item.desc_ta || item.desc,
                            price: item.price || 0,
                            image: item.image || '',
                            video: item.video || '',
                            link: item.link || '',
                            notes: item.notes || '',
                            type: item.type || 'own',
                            created_at: item.createdAt ? new Date(item.createdAt).toISOString() : new Date().toISOString()
                        });
                        if (error) console.error('Supabase upsert product error:', error);
                    }
                    // Upsert services
                    for (const item of appData.services) {
                        const { error } = await supabase.from('services').upsert({
                            id: item.id,
                            name: item.name,
                            name_en: item.name_en || item.name,
                            name_ta: item.name_ta || item.name,
                            desc: item.desc,
                            desc_en: item.desc_en || item.desc,
                            desc_ta: item.desc_ta || item.desc,
                            price: item.price || 0,
                            image: item.image || '',
                            video: item.video || '',
                            link: item.link || '',
                            notes: item.notes || '',
                            type: item.type || 'service',
                            created_at: item.createdAt ? new Date(item.createdAt).toISOString() : new Date().toISOString()
                        });
                        if (error) console.error('Supabase upsert service error:', error);
                    }
                    // Upsert daraz products
                    for (const item of appData.darazProducts) {
                        const { error } = await supabase.from('daraz_products').upsert({
                            id: item.id,
                            name: item.name,
                            name_en: item.name_en || item.name,
                            name_ta: item.name_ta || item.name,
                            desc: item.desc,
                            desc_en: item.desc_en || item.desc,
                            desc_ta: item.desc_ta || item.desc,
                            price: item.price || 0,
                            image: item.image || '',
                            video: item.video || '',
                            link: item.link || '',
                            notes: item.notes || '',
                            type: item.type || 'daraz',
                            created_at: item.createdAt ? new Date(item.createdAt).toISOString() : new Date().toISOString()
                        });
                        if (error) console.error('Supabase upsert daraz error:', error);
                    }
                    // Upsert settings
                    const { error: settingsError } = await supabase.from('settings').upsert({
                        id: 'main',
                        business_name: appData.settings.businessName,
                        phone: appData.settings.phone,
                        whatsapp: appData.settings.whatsapp,
                        location: appData.settings.location,
                        facebook: appData.settings.facebook,
                        admin_email: appData.settings.adminEmail,
                        admin_password: appData.settings.adminPassword
                    });
                    if (settingsError) console.error('Supabase upsert settings error:', settingsError);
                } catch (err) {
                    console.error('Supabase save error:', err);
                }
                // Also save to localStorage as backup
                saveDataToLocal();
            } else {
                saveDataToLocal();
            }
        }

        function saveDataToLocal() {
            if (appData) {
                localStorage.setItem('emix_data', JSON.stringify(appData));
            }
        }

        // ===== DELETE ITEM FROM SUPABASE =====
        async function deleteItemFromSupabase(table, id) {
            if (!USE_SUPABASE) return;
            try {
                const { error } = await supabase.from(table).delete().eq('id', id);
                if (error) console.error(`Supabase delete from ${table} error:`, error);
            } catch (err) {
                console.error('Supabase delete error:', err);
            }
        }

        // ===== LANGUAGE & TRANSLATIONS =====
        function switchLanguage(lang) {
            currentLanguage = lang;
            document.body.setAttribute('data-lang', lang);
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
            localStorage.setItem('emix_lang', lang);
            applyTranslations();
            renderAll();
        }

        function applyTranslations() {
            const t = translations[currentLanguage] || translations.si;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.textContent = t[key];
            });
        }

        function t(key) {
            return (translations[currentLanguage] || translations.si)[key] || translations.si[key] || key;
        }

        function getLocalizedName(item) {
            if (currentLanguage === 'si') return item.name || item.name_en || '';
            if (currentLanguage === 'en') return item.name_en || item.name || '';
            if (currentLanguage === 'ta') return item.name_ta || item.name || item.name_en || '';
            return item.name || '';
        }

        function getLocalizedDesc(item) {
            if (currentLanguage === 'si') return item.desc || item.desc_en || '';
            if (currentLanguage === 'en') return item.desc_en || item.desc || '';
            if (currentLanguage === 'ta') return item.desc_ta || item.desc || item.desc_en || '';
            return item.desc || '';
        }

        // ===== NAVIGATION =====
        function navigateTo(page) {
            if (page === 'admin') {
                window.location.hash = '#/admin/login';
                return;
            }
            if (page === 'home') window.location.hash = '#/';
            else if (page === 'products') window.location.hash = '#/products';
            else if (page === 'services') window.location.hash = '#/services';
        }

        function toggleMobileNav() {
            document.getElementById('navLinks').classList.toggle('open');
            document.getElementById('hamburgerBtn').classList.toggle('open');
        }

        // ===== HASH ROUTING =====
        function handleHashRouting() {
            const hash = window.location.hash;
            const adminSection = document.getElementById('page-admin');
            const homeSection = document.getElementById('page-home');
            const productsSection = document.getElementById('page-products');
            const servicesSection = document.getElementById('page-services');

            document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));

            if (hash.startsWith('#/admin')) {
                adminSection.classList.add('active');
                currentPage = 'admin';
                const loginForm = document.getElementById('adminLoginForm');
                const dashboard = document.getElementById('adminDashboard');
                if (isAdminLoggedIn) {
                    loginForm.style.display = 'none';
                    dashboard.classList.add('active');
                    renderAdminLists();
                } else {
                    loginForm.style.display = 'block';
                    dashboard.classList.remove('active');
                }
            } else {
                if (hash === '#/products') { productsSection.classList.add('active'); currentPage = 'products'; }
                else if (hash === '#/services') { servicesSection.classList.add('active'); currentPage = 'services'; }
                else { homeSection.classList.add('active'); currentPage = 'home'; }
                document.querySelectorAll('.nav-link').forEach(n => n.classList.toggle('active', n.dataset.page === currentPage));
                document.querySelectorAll('.bottom-nav-item').forEach(n => n.classList.toggle('active', n.dataset.page === currentPage));
                renderAll();
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.addEventListener('hashchange', handleHashRouting);

        // ===== RENDER ALL =====
        function renderAll() {
            if (!appData) return;
            renderHome(appData);
            renderProducts(appData);
            renderServices(appData);
            applyTranslations();
        }

        function renderHome(data) {
            const prodContainer = document.getElementById('homeFeaturedProducts');
            const prods = data.products.slice(0, 4);
            prodContainer.innerHTML = prods.length === 0 ? 
                `<div class="empty-state"><div class="empty-icon">📦</div><h3>${t('empty_products')}</h3></div>` :
                prods.map(p => createCardHTML(p, 'product')).join('');

            const servContainer = document.getElementById('homeFeaturedServices');
            const servs = data.services.slice(0, 4);
            servContainer.innerHTML = servs.length === 0 ? 
                `<div class="empty-state"><div class="empty-icon">🛠️</div><h3>${t('empty_services')}</h3></div>` :
                servs.map(s => createCardHTML(s, 'service')).join('');
        }

        function renderProducts(data) {
            const container = document.getElementById('allProducts');
            let products = [...data.products, ...data.darazProducts];
            if (currentProductFilter === 'own') products = data.products;
            else if (currentProductFilter === 'daraz') products = data.darazProducts;
            container.innerHTML = products.length === 0 ? 
                `<div class="empty-state"><div class="empty-icon">📦</div><h3>${t('empty_products')}</h3></div>` :
                products.map(p => createCardHTML(p, p.type === 'daraz' ? 'daraz' : 'product')).join('');
        }

        function renderServices(data) {
            const container = document.getElementById('allServices');
            container.innerHTML = data.services.length === 0 ? 
                `<div class="empty-state"><div class="empty-icon">🛠️</div><h3>${t('empty_services')}</h3></div>` :
                data.services.map(s => createCardHTML(s, 'service')).join('');
        }

        // ===== CREATE CARD HTML =====
        function createCardHTML(item, type) {
            const name = getLocalizedName(item);
            const desc = getLocalizedDesc(item);
            const price = item.price || 0;
            const imageUrl = item.image || '';
            const videoUrl = item.video || '';
            const link = item.link || '#';
            const isDaraz = type === 'daraz';
            const badgeText = isDaraz ? 'Daraz' : (type === 'service' ? t('nav_services') : 'E-Mix');
            const badgeClass = isDaraz ? 'daraz' : (type === 'service' ? 'service' : '');

            let mediaHTML = '';
            if (imageUrl) {
                mediaHTML = `<img src="${imageUrl}" alt="${name}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"><div class="placeholder-img" style="display:none;">📷</div>`;
            } else if (videoUrl) {
                mediaHTML = `<video src="${videoUrl}" muted loop playsinline preload="metadata"></video>`;
            } else {
                mediaHTML = `<div class="placeholder-img">📷</div>`;
            }

            const cardClickHandler = isDaraz ? `onclick="openDarazLink('${link}')"` : '';
            const buyButton = isDaraz ? 
                `<button class="btn btn-daraz btn-xs" onclick="openDarazLink('${link}')">🛒 ${t('daraz_go')}</button>` :
                `<button class="btn btn-buy btn-xs" onclick="buyItem('${item.id}', '${type}')">🛒 ${t('buy_now')}</button>`;

            const linkButton = (link && link !== '#') ? 
                `<button class="btn btn-link btn-xs" onclick="openLink('${link}')">🔗 ${t('view_link')}</button>` : '';

            return `
            <div class="card" data-id="${item.id}" data-type="${type}" ${cardClickHandler}>
                <div class="card-media" ${isDaraz ? `onclick="openDarazLink('${link}')"` : ''}>
                    <span class="card-badge ${badgeClass}">${badgeText}</span>
                    ${mediaHTML}
                </div>
                <div class="card-body">
                    <div class="card-title" ${isDaraz ? `onclick="openDarazLink('${link}')"` : ''}>${name}</div>
                    <div class="card-desc">${desc}</div>
                    <div class="card-price">Rs. ${price.toLocaleString()}</div>
                    <div class="card-actions">
                        ${buyButton}
                        <button class="btn btn-share btn-xs" onclick="shareItem('${item.id}', '${type}', 'whatsapp')">📤 ${t('share')}</button>
                        ${linkButton}
                    </div>
                    <div class="card-actions" style="margin-top:4px;">
                        <button class="btn btn-whatsapp btn-xs" onclick="shareToWhatsApp('${item.id}', '${type}')">💬 ${t('whatsapp_share')}</button>
                        <button class="btn btn-facebook btn-xs" onclick="shareToFacebook('${item.id}', '${type}')">📘 ${t('facebook_share')}</button>
                    </div>
                </div>
            </div>`;
        }

        // ===== DARAZ LINK =====
        function openDarazLink(link) {
            if (link && link !== '#') window.open(link, '_blank');
            else showToast('Link not set', 'error');
        }

        function filterProducts(filter) {
            currentProductFilter = filter;
            document.querySelectorAll('#productFilters .filter-tab').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === filter);
            });
            renderProducts(appData);
        }

        function buyItem(id, type) {
            const data = appData;
            let item = null;
            if (type === 'product' || type === 'own') item = data.products.find(p => p.id === id);
            else if (type === 'daraz') item = data.darazProducts.find(p => p.id === id);
            else if (type === 'service') item = data.services.find(s => s.id === id);
            if (item) {
                const name = getLocalizedName(item);
                const waNum = data.settings.whatsapp || '94782482855';
                const msg = encodeURIComponent(`මට මෙය මිලදී ගැනීමට අවශ්‍යයි: ${name} (Rs. ${item.price})`);
                window.open(`https://wa.me/${waNum}?text=${msg}`, '_blank');
            }
        }

        function shareItem(id, type, platform) {
            const data = appData;
            let item = null;
            if (type === 'product' || type === 'own') item = data.products.find(p => p.id === id);
            else if (type === 'daraz') item = data.darazProducts.find(p => p.id === id);
            else if (type === 'service') item = data.services.find(s => s.id === id);
            if (item) {
                const name = getLocalizedName(item);
                const text = encodeURIComponent(`${name} - E-Mix | Anuradhapura, Sri Lanka`);
                const url = encodeURIComponent(window.location.href);
                if (platform === 'whatsapp') window.open(`https://wa.me/?text=${text}%20${url}`, '_blank');
                else if (platform === 'facebook') window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}&quote=${text}`, '_blank');
            }
        }

        function shareToWhatsApp(id, type) { shareItem(id, type, 'whatsapp'); }
        function shareToFacebook(id, type) { shareItem(id, type, 'facebook'); }
        function openLink(url) { if (url && url !== '#') window.open(url, '_blank'); }

        // ===== ADMIN =====
        async function adminLogin() {
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value;
            const data = appData;
            if (!data || !data.settings) {
                showToast('Settings not loaded', 'error');
                return;
            }
            const adminEmail = data.settings.adminEmail || 'admin@emix.lk';
            const adminPassword = data.settings.adminPassword || 'admin123';
            if (email === adminEmail && password === adminPassword) {
                isAdminLoggedIn = true;
                sessionStorage.setItem('emix_admin_logged_in', 'true');
                showToast(t('login_success'), 'success');
                updateAdminUI();
                document.getElementById('adminPassword').value = '';
            } else {
                showToast(t('login_error'), 'error');
            }
        }

        function adminLogout() {
            isAdminLoggedIn = false;
            sessionStorage.removeItem('emix_admin_logged_in');
            showToast(t('logout_success'), 'info');
            updateAdminUI();
        }

        function updateAdminUI() {
            const loginForm = document.getElementById('adminLoginForm');
            const dashboard = document.getElementById('adminDashboard');
            if (sessionStorage.getItem('emix_admin_logged_in') === 'true') isAdminLoggedIn = true;
            if (isAdminLoggedIn) {
                if (loginForm) loginForm.style.display = 'none';
                if (dashboard) { dashboard.classList.add('active'); renderAdminLists(); }
            } else {
                if (loginForm) loginForm.style.display = 'block';
                if (dashboard) dashboard.classList.remove('active');
            }
        }

        function switchAdminTab(tabId) {
            currentAdminTab = tabId;
            document.querySelectorAll('.admin-tab').forEach(btn => btn.classList.toggle('active', btn.dataset.tab === tabId));
            document.querySelectorAll('.admin-panel').forEach(panel => panel.classList.toggle('active', panel.id === tabId));
            renderAdminLists();
        }

        function renderAdminLists() {
            const data = appData;
            if (!data) return;
            const prodList = document.getElementById('adminProductList');
            prodList.innerHTML = data.products.length === 0 ? 
                `<div class="empty-state"><p>${t('empty_products')}</p></div>` :
                data.products.map(p => `
                    <div class="admin-item">
                        ${p.image ? `<img src="${p.image}" alt="" onerror="this.style.display='none'">` : '<div style="width:50px;height:50px;border-radius:8px;background:#f0f0f5;display:flex;align-items:center;justify-content:center;font-size:20px;">📦</div>'}
                        <div class="admin-item-info"><div class="name">${getLocalizedName(p)}</div><div class="meta">Rs. ${(p.price||0).toLocaleString()}</div></div>
                        <div class="admin-item-actions">
                            <button class="btn btn-outline btn-xs" onclick="editItem('${p.id}', 'product')">${t('edit')}</button>
                            <button class="btn btn-outline btn-xs" style="color:#e74c3c;border-color:#e74c3c;" onclick="deleteItem('${p.id}', 'product')">${t('delete')}</button>
                        </div>
                    </div>`).join('');

            const servList = document.getElementById('adminServiceList');
            servList.innerHTML = data.services.length === 0 ? 
                `<div class="empty-state"><p>${t('empty_services')}</p></div>` :
                data.services.map(s => `
                    <div class="admin-item">
                        ${s.image ? `<img src="${s.image}" alt="" onerror="this.style.display='none'">` : '<div style="width:50px;height:50px;border-radius:8px;background:#f0f0f5;display:flex;align-items:center;justify-content:center;font-size:20px;">🛠️</div>'}
                        <div class="admin-item-info"><div class="name">${getLocalizedName(s)}</div><div class="meta">Rs. ${(s.price||0).toLocaleString()}</div></div>
                        <div class="admin-item-actions">
                            <button class="btn btn-outline btn-xs" onclick="editItem('${s.id}', 'service')">${t('edit')}</button>
                            <button class="btn btn-outline btn-xs" style="color:#e74c3c;border-color:#e74c3c;" onclick="deleteItem('${s.id}', 'service')">${t('delete')}</button>
                        </div>
                    </div>`).join('');

            const darazList = document.getElementById('adminDarazList');
            darazList.innerHTML = data.darazProducts.length === 0 ? 
                `<div class="empty-state"><p>${t('empty_daraz')}</p></div>` :
                data.darazProducts.map(d => `
                    <div class="admin-item">
                        ${d.image ? `<img src="${d.image}" alt="" onerror="this.style.display='none'">` : '<div style="width:50px;height:50px;border-radius:8px;background:#f0f0f5;display:flex;align-items:center;justify-content:center;font-size:20px;">🛒</div>'}
                        <div class="admin-item-info"><div class="name">${getLocalizedName(d)}</div><div class="meta">Rs. ${(d.price||0).toLocaleString()} | Daraz</div></div>
                        <div class="admin-item-actions">
                            <button class="btn btn-outline btn-xs" onclick="editItem('${d.id}', 'daraz')">${t('edit')}</button>
                            <button class="btn btn-outline btn-xs" style="color:#e74c3c;border-color:#e74c3c;" onclick="deleteItem('${d.id}', 'daraz')">${t('delete')}</button>
                        </div>
                    </div>`).join('');
        }

        function openAddModal(type) {
            document.getElementById('modalTitle').textContent = t('add_item');
            document.getElementById('modalEditId').value = '';
            document.getElementById('modalType').value = type;
            document.getElementById('modalName').value = '';
            document.getElementById('modalDesc').value = '';
            document.getElementById('modalPrice').value = '';
            document.getElementById('modalLink').value = '';
            document.getElementById('modalImage').value = '';
            document.getElementById('modalVideo').value = '';
            document.getElementById('modalNotes').value = '';
            document.getElementById('addEditModal').classList.add('open');
        }

        function editItem(id, type) {
            const data = appData;
            let item = null;
            if (type === 'product') item = data.products.find(p => p.id === id);
            else if (type === 'service') item = data.services.find(s => s.id === id);
            else if (type === 'daraz') item = data.darazProducts.find(d => d.id === id);
            if (item) {
                document.getElementById('modalTitle').textContent = t('edit');
                document.getElementById('modalEditId').value = id;
                document.getElementById('modalType').value = type;
                document.getElementById('modalName').value = item.name || '';
                document.getElementById('modalDesc').value = item.desc || '';
                document.getElementById('modalPrice').value = item.price || '';
                document.getElementById('modalLink').value = item.link || '';
                document.getElementById('modalImage').value = item.image || '';
                document.getElementById('modalVideo').value = item.video || '';
                document.getElementById('modalNotes').value = item.notes || '';
                document.getElementById('addEditModal').classList.add('open');
            }
        }

        function closeModal() { document.getElementById('addEditModal').classList.remove('open'); }

        async function saveModalItem() {
            const data = appData;
            const id = document.getElementById('modalEditId').value;
            const type = document.getElementById('modalType').value;
            const name = document.getElementById('modalName').value.trim();
            const desc = document.getElementById('modalDesc').value.trim();
            const price = parseFloat(document.getElementById('modalPrice').value) || 0;
            const link = document.getElementById('modalLink').value.trim();
            const image = document.getElementById('modalImage').value.trim();
            const video = document.getElementById('modalVideo').value.trim();
            const notes = document.getElementById('modalNotes').value.trim();
            if (!name) { showToast('Name is required', 'error'); return; }

            const itemData = {
                name, name_en: name, name_ta: name,
                desc, desc_en: desc, desc_ta: desc,
                price, link, image, video, notes,
                type: type === 'daraz' ? 'daraz' : (type === 'service' ? 'service' : 'own')
            };

            if (id) {
                if (type === 'product' || type === 'own') {
                    const idx = data.products.findIndex(p => p.id === id);
                    if (idx > -1) data.products[idx] = { ...data.products[idx], ...itemData };
                } else if (type === 'service') {
                    const idx = data.services.findIndex(s => s.id === id);
                    if (idx > -1) data.services[idx] = { ...data.services[idx], ...itemData };
                } else if (type === 'daraz') {
                    const idx = data.darazProducts.findIndex(d => d.id === id);
                    if (idx > -1) data.darazProducts[idx] = { ...data.darazProducts[idx], ...itemData };
                }
            } else {
                const newItem = { ...itemData, id: Date.now().toString() + Math.random().toString(36).substr(2, 6), createdAt: new Date().toISOString() };
                if (type === 'product' || type === 'own') data.products.push(newItem);
                else if (type === 'service') data.services.push(newItem);
                else if (type === 'daraz') data.darazProducts.push(newItem);
            }

            await saveData();
            closeModal();
            showToast(t('save_success'), 'success');
            renderAll();
        }

        async function deleteItem(id, type) {
            if (!confirm(t('confirm_delete'))) return;
            const data = appData;
            if (type === 'product') {
                data.products = data.products.filter(p => p.id !== id);
                await deleteItemFromSupabase('products', id);
            } else if (type === 'service') {
                data.services = data.services.filter(s => s.id !== id);
                await deleteItemFromSupabase('services', id);
            } else if (type === 'daraz') {
                data.darazProducts = data.darazProducts.filter(d => d.id !== id);
                await deleteItemFromSupabase('daraz_products', id);
            }
            await saveData();
            showToast(t('delete_success'), 'success');
            renderAll();
        }

        async function saveSettings() {
            const data = appData;
            data.settings.businessName = document.getElementById('settingsName').value || 'E-Mix';
            data.settings.phone = document.getElementById('settingsPhone').value || '0715205901';
            data.settings.whatsapp = document.getElementById('settingsWhatsapp').value || '94782482855';
            data.settings.location = document.getElementById('settingsLocation').value || 'Anuradhapura, Sri Lanka';
            data.settings.facebook = document.getElementById('settingsFacebook').value || '';
            data.settings.adminEmail = document.getElementById('settingsAdminEmail').value || 'admin@emix.lk';
            data.settings.adminPassword = document.getElementById('settingsAdminPassword').value || 'admin123';
            await saveData();
            showToast(t('settings_saved'), 'success');
            renderAll();
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 3000);
        }

        function populateSettingsForm() {
            if (!appData || !appData.settings) return;
            const s = appData.settings;
            document.getElementById('settingsName').value = s.businessName || 'E-Mix';
            document.getElementById('settingsPhone').value = s.phone || '0715205901';
            document.getElementById('settingsWhatsapp').value = s.whatsapp || '94782482855';
            document.getElementById('settingsLocation').value = s.location || 'Anuradhapura, Sri Lanka';
            document.getElementById('settingsFacebook').value = s.facebook || '';
            document.getElementById('settingsAdminEmail').value = s.adminEmail || 'admin@emix.lk';
            document.getElementById('settingsAdminPassword').value = s.adminPassword || 'admin123';
        }

        // ===== INIT =====
        async function init() {
            await getData(); // Supabase/LocalStorage වලින් දත්ත ලබා ගන්න
            const savedLang = localStorage.getItem('emix_lang') || 'si';
            switchLanguage(savedLang);
            if (sessionStorage.getItem('emix_admin_logged_in') === 'true') isAdminLoggedIn = true;
            setTimeout(() => document.getElementById('preloader').classList.add('hidden'), 400);
            if (!window.location.hash) window.location.hash = '#/';
            handleHashRouting();
            populateSettingsForm();
            document.getElementById('addEditModal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
        }

        document.addEventListener('DOMContentLoaded', init);
        if (document.readyState === 'complete' || document.readyState === 'interactive') init();
    </script>
</body>
